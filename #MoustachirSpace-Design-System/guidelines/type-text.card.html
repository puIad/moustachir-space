<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--white); color: var(--ink-900); }
  .wrap { padding: 22px 24px; }
  .h2 { font: var(--fw-bold) 21px/1.2 var(--font-display); letter-spacing: -0.02em; }
  .body { font: var(--fw-medium) 15px/1.45 var(--font-text); color: var(--ink-700); margin-top: 8px; max-width: 560px; }
  .label { font: var(--fw-medium) 12px/1 var(--font-text); color: var(--ink-400); margin-top: 14px; }
  .value { font: var(--fw-semibold) 15px/1.3 var(--font-text); color: var(--ink-900); margin-top: 3px; }
  .meta { font: var(--fw-medium) 11px/1 var(--font-mono); color: var(--ink-400); margin-top: 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="h2">My Missions</div>
    <div class="body">Track leads, missions and client feedback from one space. Manrope carries every label, value and paragraph of the product UI.</div>
    <div class="label">Full Name</div>
    <div class="value">Houssem Eddine Bouslimane</div>
    <div class="meta">Manrope · 400 / 500 / 600 / 700 / 800</div>
  </div>
</body>
</html>
