<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--white); color: var(--ink-900); }
  .wrap { padding: 22px 24px; }
  .display { font: var(--fw-bold) 34px/1.08 var(--font-display); letter-spacing: -0.02em; }
  .h1 { font: var(--fw-bold) 26px/1.2 var(--font-display); letter-spacing: -0.02em; margin-top: 14px; }
  .meta { font: var(--fw-medium) 11px/1 var(--font-mono); color: var(--ink-400); margin-top: 14px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="display">Sign in to your<br>MousSpace Account</div>
    <div class="h1">New Lead · Client Feedback</div>
    <div class="meta">Space Grotesk · 700 · −2% tracking · display / h1</div>
  </div>
</body>
</html>
