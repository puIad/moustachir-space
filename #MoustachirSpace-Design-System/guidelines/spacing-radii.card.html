<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="6 → pill · cards 18, fields 14, buttons pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--white); }
  .row { display: flex; gap: 14px; padding: 22px; }
  .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 100%; height: 70px; background: var(--blue-50); border: 1.5px solid var(--blue-300); }
  .lab { font: var(--fw-bold) 11px/1 var(--font-mono); color: var(--ink-700); }
  .px { font: var(--fw-medium) 10px/1 var(--font-mono); color: var(--ink-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius: var(--radius-xs)"></div><span class="lab">xs</span><span class="px">6 · chips</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-sm)"></div><span class="lab">sm</span><span class="px">10 · input</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-md)"></div><span class="lab">md</span><span class="px">14 · field</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-lg)"></div><span class="lab">lg</span><span class="px">18 · card</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-xl)"></div><span class="lab">xl</span><span class="px">24 · hero</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-pill)"></div><span class="lab">pill</span><span class="px">btn</span></div>
  </div>
</body>
</html>
