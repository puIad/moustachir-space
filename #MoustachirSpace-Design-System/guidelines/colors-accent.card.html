<!-- @dsCard group="Colors" viewport="700x150" name="Accent & Semantic" subtitle="Warm orange accent + status colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--white); }
  .row { display: flex; gap: 8px; padding: 20px; }
  .sw { flex: 1; height: 96px; border-radius: var(--radius-sm); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-sizing: border-box; }
  .name { font: var(--fw-bold) 12px/1 var(--font-text); }
  .hex { font: var(--fw-medium) 10px/1.4 var(--font-mono); opacity: .85; margin-top: 3px; }
  .dark { color: #fff; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw dark" style="background: var(--orange-500)"><span class="name">orange ·&nbsp;accent</span><span class="hex">#ff9142</span></div>
    <div class="sw dark" style="background: var(--green-500)"><span class="name">green ·&nbsp;success</span><span class="hex">#1fb255</span></div>
    <div class="sw dark" style="background: var(--red-500)"><span class="name">red ·&nbsp;error</span><span class="hex">#f0453e</span></div>
    <div class="sw dark" style="background: var(--amber-500); color: var(--ink-900)"><span class="name">amber ·&nbsp;rating</span><span class="hex">#f5b81f</span></div>
    <div class="sw" style="background: var(--orange-50); color: var(--orange-600)"><span class="name">orange-50</span><span class="hex">#fff1e6</span></div>
    <div class="sw" style="background: var(--green-50); color: var(--green-500)"><span class="name">green-50</span><span class="hex">#e7f7ed</span></div>
  </div>
</body>
</html>
