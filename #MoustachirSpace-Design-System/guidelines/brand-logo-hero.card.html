<!-- @dsCard group="Brand" viewport="700x200" name="Logo on Space" subtitle="White lockup on the navy hero panel" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--white); padding: 18px; }
  .hero {
    height: 156px; border-radius: var(--radius-xl);
    background: var(--grad-hero);
    position: relative; overflow: hidden;
    display: flex; align-items: center; padding: 0 32px;
  }
  /* subtle star/grid texture echoing the login hero */
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.2px 1.2px at 70% 60%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.6px 1.6px at 85% 25%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 45% 75%, rgba(255,255,255,.35), transparent),
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: auto, auto, auto, auto, 48px 48px, 48px 48px;
  }
  img { height: 44px; position: relative; }
</style>
</head>
<body>
  <div class="hero">
    <img src="../assets/moustachir-logo-white.png" alt="MoustachirSpace">
  </div>
</body>
</html>
