<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Roles from display down to micro" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-text); background: var(--white); color: var(--ink-900); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 24px; border-bottom: 1px solid var(--line-100); vertical-align: baseline; }
  tr:last-child td { border-bottom: none; }
  .spec { color: var(--ink-400); font: var(--fw-medium) 11px/1 var(--font-mono); white-space: nowrap; text-align: right; width: 1%; }
  .sample { letter-spacing: -0.01em; }
</style>
</head>
<body>
  <table>
    <tr><td class="sample" style="font:var(--fw-bold) 30px/1 var(--font-display)">Display</td><td class="spec">34 / 700</td></tr>
    <tr><td class="sample" style="font:var(--fw-bold) 24px/1 var(--font-display)">Screen title</td><td class="spec">26 / 700</td></tr>
    <tr><td class="sample" style="font:var(--fw-bold) 20px/1 var(--font-display)">Section header</td><td class="spec">21 / 700</td></tr>
    <tr><td class="sample" style="font:var(--fw-semibold) 17px/1 var(--font-display)">Card title</td><td class="spec">18 / 600</td></tr>
    <tr><td class="sample" style="font:var(--fw-medium) 15px/1 var(--font-text)">Body &amp; field value</td><td class="spec">15 / 500</td></tr>
    <tr><td class="sample" style="font:var(--fw-medium) 12px/1 var(--font-text); color:var(--ink-400)">FIELD LABEL · caption</td><td class="spec">12 / 500</td></tr>
  </table>
</body>
</html>
