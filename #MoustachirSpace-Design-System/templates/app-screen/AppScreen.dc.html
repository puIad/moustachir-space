<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="App Screen" description="MoustachirSpace mobile screen scaffold — status bar, header, content cards, glossy action, bottom nav" -->
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    body { margin: 0; background: radial-gradient(120% 90% at 50% 0%, #e9eef6 0%, #dfe5f0 100%); }
    .ms-stars { background-image:
        radial-gradient(1.5px 1.5px at 18% 24%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.6px 1.6px at 82% 22%, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.5), transparent),
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: auto, auto, auto, 46px 46px, 46px 46px; }
  </style>
</helmet>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px; font-family:var(--font-text);">
  <div style="width:390px; height:800px; background:#0d0d14; border-radius:50px; padding:11px; box-shadow:0 40px 90px rgba(21,35,63,.32);">
    <div style="position:relative; width:100%; height:100%; background:var(--surface-2); border-radius:40px; overflow:hidden; display:flex; flex-direction:column;">

      <!-- status bar -->
      <div style="height:46px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 26px; font:var(--fw-bold) 14px var(--font-text); color:var(--ink-900);">
        <span>9:41</span>
        <span style="display:flex; gap:6px;"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-high"></i></span>
      </div>

      <!-- header -->
      <header style="display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:6px 16px 10px;">
        <button style="width:44px; height:44px; border:none; background:transparent; color:var(--ink-700); font-size:20px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;"><i class="ph ph-arrow-left"></i></button>
        <h1 style="margin:0; justify-self:center; font:var(--fw-bold) 26px/1.2 var(--font-display); letter-spacing:-0.02em; color:var(--ink-900);">Screen Title</h1>
        <button style="position:relative; width:44px; height:44px; border:none; background:transparent; color:var(--ink-700); font-size:20px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;"><i class="ph-fill ph-bell"></i><span style="position:absolute; top:8px; right:8px; width:8px; height:8px; border-radius:999px; background:var(--blue-500); box-shadow:0 0 0 2px var(--surface-2);"></span></button>
      </header>

      <!-- content -->
      <main style="flex:1; min-height:0; overflow-y:auto; padding:6px 16px 16px; display:flex; flex-direction:column; gap:14px;">

        <!-- field card -->
        <div style="background:var(--surface-card); border-radius:var(--radius-md); padding:10px 14px; box-shadow:var(--shadow-sm), inset 0 0 0 1px var(--line-200);">
          <label style="display:block; font:var(--fw-medium) var(--fs-label)/1 var(--font-text); color:var(--ink-400); margin-bottom:4px;">Field Label</label>
          <div style="font:var(--fw-semibold) var(--fs-body)/1.3 var(--font-text); color:var(--ink-900);">Field value</div>
        </div>

        <!-- info card -->
        <div style="background:var(--surface-card); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow-card);">
          <h3 style="margin:0 0 6px; font:var(--fw-bold) var(--fs-h3)/1.2 var(--font-display); letter-spacing:-0.01em; color:var(--ink-900);">Card title</h3>
          <p style="margin:0; font:var(--fw-medium) var(--fs-body)/1.5 var(--font-text); color:var(--ink-500);">Drop content here. Use design-system tokens for every colour, radius and shadow.</p>
        </div>

        <!-- tint card with status pill -->
        <div style="background:var(--surface-tint); border-radius:var(--radius-lg); padding:16px;">
          <span style="display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:var(--radius-xs); background:var(--status-progress-bg); color:var(--status-progress); font:var(--fw-bold) var(--fs-micro)/1 var(--font-text);"><span style="width:6px; height:6px; border-radius:999px; background:currentColor;"></span>In Progress</span>
        </div>

      </main>

      <!-- sticky action -->
      <div style="flex:0 0 auto; padding:12px 16px 16px; background:linear-gradient(to top, var(--surface-2) 70%, transparent);">
        <x-import component-from-global-scope="MoustachirSpaceDesignSystem_d4c8ce.Button" variant="primary" full="{{ true }}" size="lg" hint-size="100%,52px">Submit</x-import>
      </div>

      <!-- bottom nav -->
      <nav style="flex:0 0 auto; display:flex; align-items:center; height:var(--nav-h); padding:0 12px; background:var(--surface-card); box-shadow:0 -6px 24px rgba(21,35,63,.07);">
        <div style="display:flex; flex:1; justify-content:space-around; color:var(--blue-500); font-size:24px;"><i class="ph-fill ph-house"></i><i class="ph ph-calendar-blank" style="color:var(--ink-300)"></i></div>
        <div style="width:76px; flex:0 0 auto; display:flex; justify-content:center;">
          <button style="width:56px; height:56px; margin-top:-26px; border-radius:999px; border:4px solid var(--surface-card); background:var(--blue-500); color:#fff; font-size:26px; box-shadow:var(--glow-primary); cursor:pointer; display:flex; align-items:center; justify-content:center;"><i class="ph ph-plus"></i></button>
        </div>
        <div style="display:flex; flex:1; justify-content:space-around; color:var(--ink-300); font-size:24px;"><i class="ph ph-chat-circle-text"></i><i class="ph ph-users-three"></i></div>
      </nav>

    </div>
  </div>
</div>

</x-dc>
</body>
</html>
