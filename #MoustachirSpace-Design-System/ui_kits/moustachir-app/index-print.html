<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoustachirSpace — Mobile App Screens</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; box-sizing: border-box; }
  @page { size: 460px 870px; margin: 0; }

  body { margin: 0; padding: 0; font-family: var(--font-text); background: #dfe5f0; }

  .page {
    width: 460px; height: 870px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #e9eef6 0%, #dfe5f0 100%);
    break-after: page; break-inside: avoid;
  }
  .page:last-of-type { break-after: auto; }

  .device {
    width: 390px; height: 800px; background: #0d0d14;
    border-radius: 50px; padding: 11px;
    box-shadow: 0 40px 90px rgba(21,35,63,.32), 0 8px 24px rgba(21,35,63,.18);
    flex: 0 0 auto;
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background: var(--white); border-radius: 40px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 132px; height: 30px; background: #0d0d14;
    border-bottom-left-radius: 18px; border-bottom-right-radius: 18px; z-index: 50;
  }
  .statusbar {
    flex: 0 0 46px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; z-index: 40;
    font: var(--fw-bold) 14px var(--font-text);
  }
  .viewport { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* starfield */
  .ms-stars { background-image:
      radial-gradient(1.5px 1.5px at 18% 24%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.2px 1.2px at 62% 50%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.7px 1.7px at 82% 22%, rgba(255,255,255,.8), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 92% 64%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,.4), transparent),
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: auto,auto,auto,auto,auto,auto, 46px 46px, 46px 46px; }

  ::-webkit-scrollbar { width: 0; height: 0; }

  @media print {
    *, *::before, *::after {
      animation-delay: -99s !important; animation-duration: .001s !important;
      animation-iteration-count: 1 !important; animation-fill-mode: both !important;
      animation-play-state: running !important; transition-duration: 0s !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="LoginScreen.jsx" data-presets="react"></script>
<script type="text/babel" src="DashboardScreen.jsx" data-presets="react"></script>
<script type="text/babel" src="NewLeadScreen.jsx" data-presets="react"></script>
<script type="text/babel" src="FeedbackScreen.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
const NS = window.MoustachirSpaceDesignSystem_d4c8ce;
const { BottomNav } = NS;

const NAV = [
  { key:'home',     icon:<i className="ph ph-house" />,          iconActive:<i className="ph-fill ph-house" /> },
  { key:'calendar', icon:<i className="ph ph-calendar-blank" />,  iconActive:<i className="ph-fill ph-calendar-blank" /> },
  { key:'feedback', icon:<i className="ph ph-chat-circle-text" />,iconActive:<i className="ph-fill ph-chat-circle-text" /> },
  { key:'clients',  icon:<i className="ph ph-users-three" />,     iconActive:<i className="ph-fill ph-users-three" /> },
];

const StatusBar = ({ light }) => (
  <div className="statusbar" style={{ color: light ? '#fff' : 'var(--ink-900)' }}>
    <span>9:41</span>
    <span style={{ display:'flex', gap:6, alignItems:'center' }}>
      <i className="ph-fill ph-cell-signal-full" />
      <i className="ph-fill ph-wifi-high" />
      <i className="ph-fill ph-battery-high" />
    </span>
  </div>
);

function DeviceFrame({ children, showNav = false, navActive = 'home', lightStatus = false, label }) {
  return (
    <div className="page" aria-label={label}>
      <div className="device">
        <div className="screen">
          <div className="notch" />
          <StatusBar light={lightStatus} />
          <div className="viewport">
            {children}
            {showNav && (
              <div style={{ flexShrink: 0 }}>
                <BottomNav items={NAV} active={navActive} onSelect={() => {}} onFab={() => {}} />
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function PrintApp() {
  return (
    <>
      {/* Screen 1 — Login */}
      <DeviceFrame label="Login" lightStatus={false}>
        <window.LoginScreen onLogin={() => {}} />
      </DeviceFrame>

      {/* Screen 2 — Dashboard */}
      <DeviceFrame label="Dashboard" showNav navActive="home">
        <window.DashboardScreen onOpenMission={() => {}} />
      </DeviceFrame>

      {/* Screen 3 — New Lead */}
      <DeviceFrame label="New Lead" showNav navActive="home">
        <window.NewLeadScreen onBack={() => {}} onSubmit={() => {}} />
      </DeviceFrame>

      {/* Screen 4 — Feedback */}
      <DeviceFrame label="Feedback" showNav navActive="feedback">
        <window.FeedbackScreen onBack={() => {}} onSubmit={() => {}} />
      </DeviceFrame>
    </>
  );
}

window.__renderDone = false;
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PrintApp />);
// signal render complete after first paint
requestAnimationFrame(() => requestAnimationFrame(() => { window.__renderDone = true; }));
</script>

<script>
addEventListener('load', () => {
  (async () => {
    // wait for Babel/React to finish rendering
    await new Promise(r => {
      const check = () => window.__renderDone ? r() : requestAnimationFrame(check);
      check();
    });
    // wait for fonts
    try { await document.fonts.ready; } catch(e) {}
    // wait for images
    const imgs = Array.from(document.images).filter(i => !i.complete);
    await Promise.race([
      Promise.allSettled(imgs.map(i => i.decode())),
      new Promise(r => setTimeout(r, 8000)),
    ]);
    setTimeout(() => window.print(), 500);
  })();
});
</script>
</body>
</html>
